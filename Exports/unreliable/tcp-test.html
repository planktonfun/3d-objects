<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 Object Physics Sandbox</title>

<style>
html, body {
    margin: 0;
    overflow: hidden;
    background: #20242a;
}

canvas {
    display: block;
    background: #2f7fd8;
}

#info{
    position:absolute;
    left:10px;
    top:10px;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    background:rgba(0,0,0,.45);
    padding:8px 12px;
    border-radius:8px;
}
</style>
<script src="./fastBitPacker.js"></script>
<script src="./delta-fixed-size.js"></script>
<script src="./tiny-binary-schema.js"></script>
<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
</head>
<body>

<div id="info">
10 Objects • Moving Forever
</div>

<canvas id="canvas"></canvas>

<script src='./fastBitPacker.browser.js'></script>
<script>

const urlParams = new URLSearchParams(window.location.search);
const isHost = urlParams.get('host');

function animate(){

    requestAnimationFrame(animate);

    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(isHost) {

        for(const b of balls) {
            b.update();
        }

    } else {

        for(const b of balls)
            b.updateClient();

        for(const b of triangles)
            b.updateClient();

    }

    handleCollisions();

    for(const b of balls)
        b.draw();

    for(const b of triangles)
        b.draw();

    ctx.fillStyle="white";
    ctx.font="16px Arial";
    ctx.fillText("Objects: "+balls.length,10,canvas.height-15);

    // if(window.broadcast) broadcast();
}

animate();


const objectSet = {};

if(isHost) {

} else {
    for (var i = 0; i < balls.length; i++) {
        objectSet[balls[i].id] = balls[i];
    }

    for (var i = 0; i < triangles.length; i++) {
        objectSet[triangles[i].id] = triangles[i];
    }
}

canvas.addEventListener('mousemove', (event) => {
  const x = event.clientX;
  const y = event.clientY;

  if(isHost) {
   } else {
        if(window.sendRequest) sendRequest({x,y});
   }
  triangles[0].x = x;
  triangles[0].y = y;
});

canvas.addEventListener('touchmove', (e) => {
  // Prevent scrolling while moving/dragging
  e.preventDefault();

  // Get coordinates for the first finger
  const touch = e.touches[0];
  const x = touch.clientX;
  const y = touch.clientY;

  if(isHost) {
   } else {
        if(window.sendRequest) sendRequest({x,y});
   }
  triangles[0].x = x;
  triangles[0].y = y;
});

</script>
<script>

// ── Shared schema for input (e.g., mouse/touch) ──
const inputSchema = new BinarySchema({ x: 'float32', y: 'float32' });

// ── State helpers (your existing pack/unpack functions) ──
function applyPackedState(buffer, unpackFn) {
  const { states } = unpackManyWithHeader(buffer, unpackFn);
  states.forEach(s => objectSet[s.id].deserialize(s));
  return buffer;
}

// ── SERVER ──
if (isHost) {
  const peer = new Peer('server-tcp-hi');
  const clients = [];
  let tick = 0, prevState = null, current = null;

  peer.on('open', id => console.log('Waiting for connections', id));

  peer.on('connection', conn => {
    clients.push(conn);

    conn.on('data', raw => {
      const input = inputSchema.decode(new Uint8Array(raw));
      triangles[0].x = input.x;
      triangles[0].y = input.y;
    });

    conn.on('open', () => {
      if (current) conn.send(packPacket(tick, 1, current).buffer);
    });
  });
  let lastPayload = null;
  function broadcast() {
    if (!clients.length) return;

    const states = [
      ...balls.map(b => b.serialize()),
      ...triangles.map(t => t.serialize())
    ];
    current = packManyWithHeader(states, packer.packFast);
    const payload = prevState ? createDeltaOptimized(prevState, current) : current;
    prevState = current;
    lastPayload = payload;
    const packet = packPacket(tick, 2, payload);
    clients.forEach(conn => {
      if (conn?.open && conn.dataChannel.bufferedAmount < 16384) {
        conn.send(packet.buffer);
      }
    });
    tick++;
  }

  setInterval(broadcast, 1000 / fps);
  setInterval(()=>{
        if(!lastPayload) return;
        console.log(
            getMaxUserCount(lastPayload.byteLength/states.length, 5_000_000, fps)
        )
    }, 1000);
}

// ── CLIENT ──
else {
  const peer = new Peer();
  let previous = null, receivedTick = -1, receivedInitial = false;

  peer.on('open', () => {
    const conn = peer.connect('server-tcp-hi', { reliable: true });
    conn.on('error', console.error);

    conn.on('data', raw => {
      const { tick, type, payload } = unpackPacket(raw);

      if (receivedTick > tick) return;
      receivedTick = tick;

      if (type === 1) {
        previous = applyPackedState(payload, packer.unpackFast);
        receivedInitial = true;
      } else if (type === 2 && receivedInitial) {
        const rebuilt = applyDeltaOptimized(previous, payload);
        previous = applyPackedState(rebuilt, packer.unpackFast);
      }
    });

    conn.on('close', () => console.log('❌ Connection closed.'));

    window.sendRequest = data => {
      if (conn?.open && conn.dataChannel.bufferedAmount < 16384) {
        conn.send(inputSchema.encode(data).buffer);
      }
    };
  });
}

</script>
