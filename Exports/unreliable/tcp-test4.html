<script>

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function resize(){
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    const deterministicBalls = [];
    const balls = [];
    const triangles = [];
    const COUNT = 15;
    let ballId = 0;

    class ClientObject {
        constructor() {
            this.id = -1;
            this.type = -1;
            this.seed = -1;
            this.x = -1;
            this.y = -1;
            this.targetX = -1;
            this.targetY = -1;
            this.easingPercent = Math.min(0.99, 0.99/60 * FPS);
            this.flags = new BitFlags();
        }

        updateClient(){
            if(INTERPOLATION_ENABLED) {
                this.x = lerp(this.x, this.targetX, this.easingPercent);
                this.y = lerp(this.y, this.targetY, this.easingPercent);
            } else {
                this.x = this.targetX;
                this.y = this.targetY;
            }
        }

        serialize() {
            multiplayerObjects.seed[this.id]   = Math.floor(this.seed);
            multiplayerObjects.type[this.id]   = Math.floor(this.type);
            multiplayerObjects.flags[this.id]   = this.flags.value;

            if(SPATIAL_LOCALIZATION_ENABLED == true) {
                const encoded = encodePosition(this.x, this.y);
                multiplayerObjects.cellX[this.id]   = encoded.cellX;
                multiplayerObjects.cellY[this.id]   = encoded.cellY;
                multiplayerObjects.offsetX[this.id] = encoded.offsetX;
                multiplayerObjects.offsetY[this.id] = encoded.offsetY;
            } else {
                multiplayerObjects.x[this.id]      = Math.floor(this.x);
                multiplayerObjects.y[this.id]      = Math.floor(this.y);
            }
        }

        decodeTarget() {

            this.seed = multiplayerObjects.seed[this.id];
            this.flags.value = multiplayerObjects.flags[this.id];

            if(SPATIAL_LOCALIZATION_ENABLED == true) {
                const decoded = decodePosition(
                    multiplayerObjects.cellX[this.id],
                    multiplayerObjects.cellY[this.id],
                    multiplayerObjects.offsetX[this.id],
                    multiplayerObjects.offsetY[this.id]
                );

                this.targetX = decoded.x;
                this.targetY = decoded.y;
            } else {
                this.targetX = multiplayerObjects.x[this.id];
                this.targetY = multiplayerObjects.y[this.id];
            }

        }

        deserialize() {
            this.decodeTarget();
        }
    }

    //---------------------------------------------------
    // Data first, animation second Bits (can only have up to 8 or 1 << 7) for 8 bits
    //---------------------------------------------------
    const DIRTY_SKILL_1 = 1 << 0;
    const DIRTY_SKILL_2 = 1 << 1;
    const DIRTY_SKILL_3 = 1 << 2;
    const DIRTY_SKILL_4 = 1 << 3;
    const DIRTY_SKILL_5 = 1 << 4;
    const DIRTY_SKILL_6 = 1 << 5;
    const DIRTY_SKILL_7 = 1 << 6;
    const DIRTY_SKILL_8 = 1 << 7;

    class Ball extends ClientObject {

        constructor(x,y,r){
            super();

            this.id = ++ballId;
            this.type = 1;
            this.seed = Math.floor(Math.random()*255);
            this.x = x;
            this.y = y;
            this.radius = 15+seedRandom(this.seed)*15;

            // Random velocity
            this.vx = (seedRandom(this.seed)-0.5)*8;
            this.vy = (seedRandom(this.seed)-0.5)*8;

            // Prevent nearly stationary balls
            if(Math.abs(this.vx)<2) this.vx = this.vx<0?-2:2;
            if(Math.abs(this.vy)<2) this.vy = this.vy<0?-2:2;

            this.color = `hsl(${seedRandom(this.seed)*360},80%,60%)`;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;

            // Left
            if(this.x-this.radius<0){
                this.x=this.radius;
                this.vx*=-1;

                this.flags.activate(DIRTY_SKILL_1);
            }

            // Right
            if(this.x+this.radius>canvas.width){
                this.x=canvas.width-this.radius;
                this.vx*=-1;

                this.flags.activate(DIRTY_SKILL_2);
            }

            // Top
            if(this.y-this.radius<0){
                this.y=this.radius;
                this.vy*=-1;

                this.flags.activate(DIRTY_SKILL_3);
            }

            // Bottom
            if(this.y+this.radius>canvas.height){
                this.y=canvas.height-this.radius;
                this.vy*=-1;

                this.flags.activate(DIRTY_SKILL_4);
            }
        }

        applyEvents() {
            if(this.flags.has(DIRTY_SKILL_1)) {
                fds.spawnNormal(this.x, this.y, this.x);
                this.flags.toggle(DIRTY_SKILL_1);
            }
            if(this.flags.has(DIRTY_SKILL_2)) {
                fds.spawnNormal(this.x, this.y, this.x);
                this.flags.toggle(DIRTY_SKILL_2);
            }
            if(this.flags.has(DIRTY_SKILL_3)) {
                fds.spawnNormal(this.x, this.y, this.x);
                this.flags.toggle(DIRTY_SKILL_3);
            }
            if(this.flags.has(DIRTY_SKILL_4)) {
                fds.spawnNormal(this.x, this.y, this.x);
                this.flags.toggle(DIRTY_SKILL_4);
            }
        }

        updateClient(){
            if(INTERPOLATION_ENABLED) {
                this.x = lerp(this.x, this.targetX, this.easingPercent);
                this.y = lerp(this.y, this.targetY, this.easingPercent);
            } else {
                this.x = this.targetX;
                this.y = this.targetY;
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(
              Math.floor(this.x),
              Math.floor(this.y),
              Math.floor(this.radius)
              ,0,Math.PI*2);
            ctx.fillStyle=this.color;
            ctx.fill();

            ctx.strokeStyle="white";
            ctx.lineWidth=2;
            ctx.stroke();
        }

        deserialize() {
            this.decodeTarget();
            this.radius = 15+seedRandom(this.seed)*15;
            this.color = `hsl(${seedRandom(this.seed)*360},80%,60%)`;
        }
    }

    class DummyBall {

        constructor(x,y,r,seed){
            this.type = 1;
            this.seed = seed % 255;
            this.x = x;
            this.y = y;
            this.radius = 15+seedRandom(this.seed)*15;

            // Random velocity
            this.vx = (seedRandom(this.seed)-0.5)*8;
            this.vy = (seedRandom(this.seed)-0.5)*8;

            // Prevent nearly stationary balls
            if(Math.abs(this.vx)<2) this.vx = this.vx<0?-2:2;
            if(Math.abs(this.vy)<2) this.vy = this.vy<0?-2:2;

            this.color = `hsl(${seedRandom(this.seed)*360},80%,60%)`;
        }

        update(){

            this.x += this.vx;
            this.y += this.vy;

            // Left
            if(this.x-this.radius<0){
                this.x=this.radius;
                this.vx*=-1;
            }

            // Right
            if(this.x+this.radius>1400){
                this.x=1400-this.radius;
                this.vx*=-1;
            }

            // Top
            if(this.y-this.radius<0){
                this.y=this.radius;
                this.vy*=-1;
            }

            // Bottom
            if(this.y+this.radius>1400){
                this.y=1400-this.radius;
                this.vy*=-1;
            }
        }

        draw(){
            ctx.beginPath();
            ctx.arc(
              Math.floor(this.x),
              Math.floor(this.y),
              Math.floor(this.radius)
              ,0,Math.PI*2);
            ctx.fillStyle=this.color;
            ctx.fill();

            ctx.strokeStyle="white";
            ctx.lineWidth=2;
            ctx.stroke();
        }
    }

    class Triangle extends Ball {
        constructor(x,y,r) {
            super(x,y,r);

            this.id = 0;
            this.type = 2;
            this.pressed = 0;
            // this.easingPercent = 0.5;
        }

        draw() {
            const x = Math.floor(this.x);
            const y = Math.floor(this.y);

            if(this.pressed) {
                ctx.fillStyle = 'red';
            } else {
                ctx.fillStyle = this.color;
            }

            ctx.strokeStyle = "white";
            ctx.lineWidth = 2;

            ctx.beginPath();

            // Cursor arrow
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + 24);
            ctx.lineTo(x + 6, y + 18);
            ctx.lineTo(x + 12, y + 30);
            ctx.lineTo(x + 17, y + 27);
            ctx.lineTo(x + 11, y + 15);
            ctx.lineTo(x + 20, y + 15);

            ctx.closePath();

            ctx.fill();
            ctx.stroke();
        }

        serialize() {
            serverCursor.seed[this.id]      = Math.floor(this.seed);
            serverCursor.type[this.id]      = Math.floor(this.type);
            serverCursor.pressed[this.id]   = this.pressed;

            if(SPATIAL_LOCALIZATION_ENABLED == true) {
                const encoded = encodePosition(this.x, this.y);
                serverCursor.cellX[this.id]   = encoded.cellX;
                serverCursor.cellY[this.id]   = encoded.cellY;
                serverCursor.offsetX[this.id] = encoded.offsetX;
                serverCursor.offsetY[this.id] = encoded.offsetY;
            } else {
                serverCursor.x[this.id]      = Math.floor(this.x);
                serverCursor.y[this.id]      = Math.floor(this.y);
            }
        }

        deserialize() {
            this.seed = serverCursor.seed[this.id];

            if(SPATIAL_LOCALIZATION_ENABLED == true) {
                const decoded = decodePosition(
                    serverCursor.cellX[this.id],
                    serverCursor.cellY[this.id],
                    serverCursor.offsetX[this.id],
                    serverCursor.offsetY[this.id]
                );

                this.targetX = decoded.x;
                this.targetY = decoded.y;
            } else {
                this.targetX = serverCursor.x[this.id];
                this.targetY = serverCursor.y[this.id];
            }

            this.color = `hsl(${seedRandom(this.seed)*360},80%,60%)`;
            this.pressed = serverCursor.pressed[this.id];
        }
    }

    // Create exactly 10 balls
    for(let i=0;i<COUNT;i++){

        balls.push(
            new Ball(
                40+Math.random()*(canvas.width-80),
                40+Math.random()*(canvas.height-80),
                15+Math.random()*15
            )
        );
    }

    triangles.push(new Triangle(0,0,10));

    function handleCollisions(){

        for(let i=0;i<balls.length;i++){

            for(let j=i+1;j<balls.length;j++){

                const a=balls[i];
                const b=balls[j];

                const dx=b.x-a.x;
                const dy=b.y-a.y;

                const dist=Math.hypot(dx,dy);
                const minDist=a.radius+b.radius;

                if(dist<minDist){

                    const nx=dx/dist;
                    const ny=dy/dist;

                    // Separate balls
                    const overlap=(minDist-dist)/2;

                    a.x-=nx*overlap;
                    a.y-=ny*overlap;

                    b.x+=nx*overlap;
                    b.y+=ny*overlap;

                    // Elastic collision
                    const dvx=a.vx-b.vx;
                    const dvy=a.vy-b.vy;

                    const impact=dvx*nx+dvy*ny;

                    if(impact>0) continue;

                    const impulse=impact;

                    a.vx-=impulse*nx;
                    a.vy-=impulse*ny;

                    b.vx+=impulse*nx;
                    b.vy+=impulse*ny;
                }
            }
        }
    }

    canvas.addEventListener('mousedown', (event) => {
        cursor.pressed[0] = 1;

        if(window.applyInput) applyInput();
    });

    canvas.addEventListener('mouseup', (event) => {
        cursor.pressed[0] = 0;

        if(window.applyInput) applyInput();
    });

    canvas.addEventListener('mousemove', (event) => {
        const x = event.clientX;
        const y = event.clientY;

        cursor.x[0] = x;
        cursor.y[0] = y;

        if(window.applyInput) applyInput();
    });

    canvas.addEventListener('touchmove', (e) => {
        // Prevent scrolling while moving/dragging
        e.preventDefault();

        // Get coordinates for the first finger
        const touch = e.touches[0];
        const x = touch.clientX;
        const y = touch.clientY;

        cursor.x[0] = x;
        cursor.y[0] = y;

        if(window.applyInput) applyInput();
    });
</script>
<script>
    let isHost = true;

    // ── State helpers ──────────────────────────────────────────

    // 1. client || server -> change data
    function applyInput() {
        // simulate locally
        triangles[0].x       = cursor.x[0];
        triangles[0].y       = cursor.y[0];
        triangles[0].pressed = cursor.pressed[0];

        // Broadcast
        if(isHost) {
            if(triangles[0].pressed) {
                outputs.x[0] = cursor.x[0];
                outputs.y[0] = cursor.y[0];
                outputs.targetTick[0] = currentTick+100;
                serverSendInput();
                applyOutput();
            }
        } else {
            if(window.clientSendInput) clientSendInput();
        }
    }

    // 2. client -> server
    function decodeInput(raw) {
        // raw is always a Uint8Array
        inputPools.deserialize(raw.buffer);
        applyInput();
    }

    // common state deserialization for both client and server
    function deserializePools() {
        balls.forEach(b => b.deserialize());
        triangles.forEach(t => t.deserialize());
    }

    // 3. server -> clients
    function applyPackedState(raw) {
        // raw is always a Uint8Array
        pools.deserialize(raw.buffer);

        deserializePools();

        return raw;  // return the same Uint8Array for chaining
    }

    function decodeOutput(raw) {
        // raw is always a Uint8Array
        outputPools.deserialize(raw.buffer);
        applyOutput();
    }

    function applyOutput() {
        console.log(outputs.x[0],outputs.y[0]);

        events.push({
            targetTick: outputs.targetTick[0],
            type: "createBall",
            x: outputs.x[0],
            y: outputs.y[0]
        });
    }

    function getStates() {
        balls.forEach(b => b.serialize());
        triangles.forEach(t => t.serialize());

        return new Uint8Array(pools.serialize());
    }

    // Collect and queue events
    const events = [];

    function executeEvents(frame, events) {
        // garbage cleanup
        while(events.length > 1000) {
            events.shift();
        }

        for (var i = 0; i < events.length; i++) {
            if(frame == events[i].targetTick) {
                switch(events[i].type) {
                    case "createBall":
                        // deterministicBalls.push(
                        //     new DummyBall(events[i].x, events[i].y, 10, events[i].targetTick)
                        // );

                        fds.spawnNormal(events[i].x, events[i].y, 100);
                    break;
                }

            }
        }
    }

    // ── Game loop ──────────────────────────────────────────────
    function logicLoop() {
        if(isHost) {

            for(const b of balls) {
                b.update();
            }

            if(broadcast) broadcast();

            for(const b of balls) {
                b.applyEvents();
            }
        } else {
            // client and host process the updates
            for(const b of balls) {
                b.updateClient();
                b.applyEvents();
            }

            for(const b of triangles) {
                b.updateClient();
                b.applyEvents();
            }
        }

        for(const b of deterministicBalls) {
            b.update();
        }

        handleCollisions();

        executeEvents(currentTick, events);
    }

    function renderLoop() {
        ctx.clearRect(0,0,canvas.width,canvas.height);

        for(const b of balls)
            b.draw();

        for(const b of triangles)
            b.draw();

        for(const b of deterministicBalls)
            b.draw();

        ctx.fillStyle="white";
        ctx.font="16px Arial";
        ctx.fillText("Objects: "+balls.length,10,canvas.height-15);
    }

    const LOOP = {
        lastTime: performance.now(),
        acc: 0,
        hz: 1000 / FPS,
        MAX_DELTA: 100, // ms, prevents spiral of death
    };

    function gameLoop() {
        const time = performance.now();
        let delta = time - LOOP.lastTime;
        LOOP.lastTime = time;

        if (delta > LOOP.MAX_DELTA) {
            console.warn('Game is slowing down');
            delta = LOOP.MAX_DELTA;
        }

        LOOP.acc += delta;

        while (LOOP.acc >= LOOP.hz) {
            logicLoop();
            LOOP.acc -= LOOP.hz;
        }

        // RENDER STUFF
        renderLoop();
        // ---- Render floating damage system ----
        fds.render(ctx);
        fds.update(delta/1000);

        requestAnimationFrame(gameLoop);
    }

    gameLoop();

    // ── Networking ─────────────────────────────────────────────
    let broadcast = null;
    let currentTick = 0;
    const PACKET_TYPE_ENUM = [
        'Snapshot',
        'Delta',
        'Event',
    ];

    function startAsHost(peer) {
        const clients = [];
        let tick = 0;
        let prevState = null;
        let current = null;
        let lastPayload = null;

        peer.on('connection', conn => {
            clients.push(conn);

            conn.on('data', raw => decodeInput(new Uint8Array(raw)));  // raw is ArrayBuffer from DataChannel
            conn.on('open', () => {
                if (current) conn.send(packPacket(tick, PACKET_TYPE_ENUM.indexOf('Snapshot'), current).buffer);
            });
        });

        // Clean up when the tab or window is closing / refreshing
        window.addEventListener('beforeunload', () => {
          if (peer && !peer.destroyed) {
            peer.destroy();
          }
        });

        broadcast = () => {
            tick++;
            currentTick = tick;

            if (!clients.length) return;

            current = getStates();
            const payload = prevState
                ? createDeltaOptimized(prevState, current)   // both are Uint8Array
                : current;
            prevState = current;
            lastPayload = payload;

            const packet = packPacket(tick, PACKET_TYPE_ENUM.indexOf('Delta'), payload);
            clients.forEach(conn => {
                if (conn?.open && conn.dataChannel.bufferedAmount < 16384) {
                    conn.send(packet.buffer);
                }
            });
        }

        window.serverSendInput = () => {
            if (!clients.length) return;
            const packet = packPacket(tick, PACKET_TYPE_ENUM.indexOf('Event'), new Uint8Array(outputPools.serialize()));
            clients.forEach(conn => {
                if (conn?.open && conn.dataChannel.bufferedAmount < 16384) {
                    conn.send(packet);   // returns ArrayBuffer, which is acceptable
                }
            });
        };

        // Optional bandwidth logging
        setInterval(() => {
            if (!lastPayload) return;
            console.log(getMaxUserCount(lastPayload.byteLength / 3, 5_000_000, FPS));
        }, 1000);
    }

    function startAsClient(peer, hostname) {
        let previous = null;
        let receivedTick = -1;
        let receivedInitial = false;

        peer.on('open', () => {
            const conn = peer.connect(hostname, { reliable: true });
            conn.on('error', console.error);

            conn.on('data', raw => {
                const { tick, type, payload } = unpackPacket(new Uint8Array(raw));

                if(type == PACKET_TYPE_ENUM.indexOf('Event')) {
                    decodeOutput(payload);
                }

                if (receivedTick > tick) return;
                receivedTick = tick;
                currentTick = receivedTick;

                if (type === PACKET_TYPE_ENUM.indexOf('Snapshot')) {
                    previous = applyPackedState(payload);
                    receivedInitial = true;
                } else if (type === PACKET_TYPE_ENUM.indexOf('Delta') && receivedInitial) {
                    const rebuilt = applyDeltaOptimized(previous, payload);
                    previous = applyPackedState(rebuilt);
                }
            });

            conn.on('close', () => {
                console.log('❌ Connection closed.');
                console.log('Refreshing the page.');
                location.href=location.href;
            });

            window.clientSendInput = () => {
                if (conn?.open && conn.dataChannel.bufferedAmount < 16384) {
                    conn.send(inputPools.serialize());   // returns ArrayBuffer, which is acceptable
                }
            };
        });
    }

<script>
    // ── Constants ──────────────────────────────────────────────
    const UNIQUE_SERVER_NAME = 'pool-tcp';
    const numberOfHosts = 10;
    const numberOfClientsPerHost = 10;

    // Auto host handling
    const connectionList = [];
    for (var i = numberOfHosts; i >= 1; i--) {
        for (var j = numberOfClientsPerHost; j >= 1; j--) {
            connectionList.unshift({ value: `${UNIQUE_SERVER_NAME}-host${i}-client${j}`, host: `${UNIQUE_SERVER_NAME}-host${i}` });
        }
        connectionList.unshift({ value: `${UNIQUE_SERVER_NAME}-host${i}`, host: null });
    }

    // Helper function converting event-based Obj into a Promise
    function connect(name, type) {
        return new Promise((resolve, reject) => {
            const peer = new Peer(name);

            peer.on('open', id => resolve(peer));
            peer.on('error', err => reject(err));
        });
    }

    async function tryConnections() {
        for (const connection of connectionList) {
            try {
                const peer = await connect(connection.value);

                // If connection succeeds, execute your callback and stop trying others
                if(connection.host) {
                    isHost = false;
                    startAsClient(new Peer(), connection.host);
                } else {
                    isHost = true;
                    startAsHost(peer);
                }

                connectionName.innerText = connection.value;
                return;
            } catch (err) {
                // Loop automatically continues to the next connection
                console.warn(`Failed for connection: ${connection.value}`, err);
            }
        }

        console.error('All attempts failed.');
    }

    tryConnections();
</script>
