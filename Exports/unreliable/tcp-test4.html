<script>

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function resize(){
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    const deterministicBalls = [];
    const balls = [];
    const triangles = [];
    const COUNT = 40;
    let ballId = 0;

    class ClientObject {
        constructor() {
            this.id = -1;
            this.type = -1;
            this.seed = -1;
            this.x = -1;
            this.y = -1;
            this.vx = 0;
            this.vy = 0;
            this.easingPercent = Math.min(0.99, 0.99/60 * FPS);
            this.flags = new BitFlags();
        }

        updateClient(dt=1){
            this.x += this.vx*dt;
            this.y += this.vy*dt;

        /*    if(INTERPOLATION_ENABLED) {
                this.x = lerp(this.x, this.targetX, this.easingPercent);
                this.y = lerp(this.y, this.targetY, this.easingPercent);
            } else {
                this.x = this.targetX;
                this.y = this.targetY;
            }*/
        }

        serialize() {
            multiplayerObjects.seed[this.id]   = Math.floor(this.seed);
            multiplayerObjects.type[this.id]   = Math.floor(this.type);
            multiplayerObjects.flags[this.id]   = this.flags.value;

            multiplayerObjects.vx[this.id] = this.vx;
            multiplayerObjects.vy[this.id] = this.vy;

            if(SPATIAL_LOCALIZATION_ENABLED == true) {
                const encoded = encodePosition(this.x, this.y);
                multiplayerObjects.cellX[this.id]   = encoded.cellX;
                multiplayerObjects.cellY[this.id]   = encoded.cellY;
                multiplayerObjects.offsetX[this.id] = encoded.offsetX;
                multiplayerObjects.offsetY[this.id] = encoded.offsetY;
            } else {
                multiplayerObjects.x[this.id] = Math.floor(this.x);
                multiplayerObjects.y[this.id] = Math.floor(this.y);
            }
        }

        decodeTarget() {

            this.seed = multiplayerObjects.seed[this.id];
            this.flags.value = multiplayerObjects.flags[this.id];

            this.vx = multiplayerObjects.vx[this.id];
            this.vy = multiplayerObjects.vy[this.id];

            if(SPATIAL_LOCALIZATION_ENABLED == true) {
                const decoded = decodePosition(
                    multiplayerObjects.cellX[this.id],
                    multiplayerObjects.cellY[this.id],
                    multiplayerObjects.offsetX[this.id],
                    multiplayerObjects.offsetY[this.id]
                );

                this.x = decoded.x;
                this.y = decoded.y;
            } else {
                this.x = multiplayerObjects.x[this.id];
                this.y = multiplayerObjects.y[this.id];
            }

        }

        deserialize() {
            this.decodeTarget();
        }
    }

    //---------------------------------------------------
    // Data first, animation second Bits (can only have up to 8 or 1 << 7) for 8 bits
    //---------------------------------------------------
    const DIRTY_SKILL_1 = 1 << 0;
    const DIRTY_SKILL_2 = 1 << 1;
    const DIRTY_SKILL_3 = 1 << 2;
    const DIRTY_SKILL_4 = 1 << 3;
    const DIRTY_SKILL_5 = 1 << 4;
    const DIRTY_SKILL_6 = 1 << 5;
    const DIRTY_SKILL_7 = 1 << 6;
    const DIRTY_SKILL_8 = 1 << 7;

    class Ball extends ClientObject {

        constructor(x,y,r){
            super();

            this.id = ++ballId;
            this.type = 1;
            this.seed = Math.floor(Math.random()*255);
            this.x = x;
            this.y = y;
            this.radius = 15+seedRandom(this.seed)*15;

            // Random velocity
            this.vx = (seedRandom(this.seed)-0.5)*8*(60/FPS);
            this.vy = (seedRandom(this.seed)-0.5)*8*(60/FPS);

            // Prevent nearly stationary balls
            if(Math.abs(this.vx)<2) this.vx = this.vx<0?-2:2;
            if(Math.abs(this.vy)<2) this.vy = this.vy<0?-2:2;

            this.color = `hsl(${seedRandom(this.seed)*360},80%,60%)`;

            this.updateFrequency = 0;

            this.damage = -1;
            this.isCrit = false;
        }

        update() {
            this.updateFrequency++;
            if(this.updateFrequency % 100 == 0) {
                this.updateFrequency = 0;
                this.flags.activate(DIRTY_SKILL_2);
            }

            this.x += this.vx;
            this.y += this.vy;

            // Left
            if(this.x-this.radius<0){
                this.x=this.radius;
                this.vx*=-1;

                this.flags.activate(DIRTY_SKILL_2);
            }

            // Right
            if(this.x+this.radius>canvas.width){
                this.x=canvas.width-this.radius;
                this.vx*=-1;

                this.flags.activate(DIRTY_SKILL_2);
            }

            // Top
            if(this.y-this.radius<0){
                this.y=this.radius;
                this.vy*=-1;

                this.flags.activate(DIRTY_SKILL_2);
            }

            // Bottom
            if(this.y+this.radius>canvas.height){
                this.y=canvas.height-this.radius;
                this.vy*=-1;

                this.flags.activate(DIRTY_SKILL_2);
            }
        }

        applyEvents() {
            if(this.flags.has(DIRTY_SKILL_1)) {
                if(this.isCrit) {
                    fds.spawnCritical(this.x, this.y, this.damage*2);
                } else {
                    fds.spawnNormal(this.x, this.y, this.damage);
                }

                this.flags.toggle(DIRTY_SKILL_1);
            }
            if(this.flags.has(DIRTY_SKILL_2)) {
                this.flags.toggle(DIRTY_SKILL_2);
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(
              Math.floor(this.x),
              Math.floor(this.y),
              Math.floor(this.radius)
              ,0,Math.PI*2);
            ctx.fillStyle=this.color;
            ctx.fill();

            ctx.strokeStyle="white";
            ctx.lineWidth=2;
            ctx.stroke();
        }

        serialize() {
            multiplayerObjects.flags[this.id]   = this.flags.value;
            if(!this.flags.has(DIRTY_SKILL_2)) {
                return;
            }

            multiplayerObjects.seed[this.id]   = Math.floor(this.seed);
            multiplayerObjects.type[this.id]   = Math.floor(this.type);

            multiplayerObjects.vx[this.id] = this.vx;
            multiplayerObjects.vy[this.id] = this.vy;

            if(SPATIAL_LOCALIZATION_ENABLED == true) {
                const encoded = encodePosition(this.x, this.y);
                multiplayerObjects.cellX[this.id]   = encoded.cellX;
                multiplayerObjects.cellY[this.id]   = encoded.cellY;
                multiplayerObjects.offsetX[this.id] = encoded.offsetX;
                multiplayerObjects.offsetY[this.id] = encoded.offsetY;
            } else {
                multiplayerObjects.x[this.id] = Math.floor(this.x);
                multiplayerObjects.y[this.id] = Math.floor(this.y);
            }
        }

        deserialize(seed) {
            this.damage = seed;
            this.isCrit = (seedRandom(seed) > 0.5);
            this.flags.value = multiplayerObjects.flags[this.id];
            if(!this.flags.has(DIRTY_SKILL_2)) {
                return;
            }

            this.seed = multiplayerObjects.seed[this.id];

            this.vx = multiplayerObjects.vx[this.id];
            this.vy = multiplayerObjects.vy[this.id];

            this.radius = 15+seedRandom(this.seed)*15;
            this.color = `hsl(${seedRandom(this.seed)*360},80%,60%)`;

            if(SPATIAL_LOCALIZATION_ENABLED == true) {
                const decoded = decodePosition(
                    multiplayerObjects.cellX[this.id],
                    multiplayerObjects.cellY[this.id],
                    multiplayerObjects.offsetX[this.id],
                    multiplayerObjects.offsetY[this.id]
                );

                this.x = decoded.x;
                this.y = decoded.y;
            } else {
                this.x = multiplayerObjects.x[this.id];
                this.y = multiplayerObjects.y[this.id];
            }
        }

    }

    class DummyBall {

        constructor(x,y,r,seed){
            this.type = 1;
            this.seed = seed % 255;
            this.x = x;
            this.y = y;
            this.radius = 15+seedRandom(this.seed)*15;

            // Random velocity
            this.vx = (seedRandom(this.seed)-0.5)*8;
            this.vy = (seedRandom(this.seed)-0.5)*8;

            // Prevent nearly stationary balls
            if(Math.abs(this.vx)<2) this.vx = this.vx<0?-2:2;
            if(Math.abs(this.vy)<2) this.vy = this.vy<0?-2:2;

            this.color = `hsl(${seedRandom(this.seed)*360},80%,60%)`;
        }

        update(){

            this.x += this.vx;
            this.y += this.vy;

            // Left
            if(this.x-this.radius<0){
                this.x=this.radius;
                this.vx*=-1;
            }

            // Right
            if(this.x+this.radius>1400){
                this.x=1400-this.radius;
                this.vx*=-1;
            }

            // Top
            if(this.y-this.radius<0){
                this.y=this.radius;
                this.vy*=-1;
            }

            // Bottom
            if(this.y+this.radius>1400){
                this.y=1400-this.radius;
                this.vy*=-1;
            }
        }

        draw(){
            ctx.beginPath();
            ctx.arc(
              Math.floor(this.x),
              Math.floor(this.y),
              Math.floor(this.radius)
              ,0,Math.PI*2);
            ctx.fillStyle=this.color;
            ctx.fill();

            ctx.strokeStyle="white";
            ctx.lineWidth=2;
            ctx.stroke();
        }
    }

    // dirty flags
    const CURSOR_PRESSED = 1 << 0;

    class Triangle extends Ball {
        constructor(x,y,r) {
            super(x,y,r);

            this.id = 0;
            this.type = 2;
            this.pressed = 0;
            this.targetX = -1;
            this.targetY = -1;

            this.damage = -1;
            this.isCrit = false;
        }

        update() {
            if(this.pressed){
                this.flags.activate(CURSOR_PRESSED);
            }
        }

        updateClient(){
            if(INTERPOLATION_ENABLED) {
                this.x = lerp(this.x, this.targetX, this.easingPercent);
                this.y = lerp(this.y, this.targetY, this.easingPercent);
            } else {
                this.x = this.targetX;
                this.y = this.targetY;
            }
        }

        applyEvents() {
            if(this.flags.has(CURSOR_PRESSED)) {
                if(this.isCrit) {
                    fds.spawnCritical(this.x, this.y, this.damage*2);
                } else {
                    fds.spawnNormal(this.x, this.y, this.damage);
                }
                this.flags.toggle(CURSOR_PRESSED);
            }
        }

        draw() {
            const x = Math.floor(this.x);
            const y = Math.floor(this.y);

            if(this.pressed) {
                ctx.fillStyle = 'red';
            } else {
                ctx.fillStyle = this.color;
            }

            ctx.strokeStyle = "white";
            ctx.lineWidth = 2;

            ctx.beginPath();

            // Cursor arrow
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + 24);
            ctx.lineTo(x + 6, y + 18);
            ctx.lineTo(x + 12, y + 30);
            ctx.lineTo(x + 17, y + 27);
            ctx.lineTo(x + 11, y + 15);
            ctx.lineTo(x + 20, y + 15);

            ctx.closePath();

            ctx.fill();
            ctx.stroke();
        }

        serialize() {
            serverCursor.seed[this.id]      = Math.floor(this.seed);
            serverCursor.type[this.id]      = Math.floor(this.type);
            serverCursor.pressed[this.id]   = this.pressed;
            serverCursor.flags[this.id]   = this.flags.value;


            if(SPATIAL_LOCALIZATION_ENABLED == true) {
                const encoded = encodePosition(this.x, this.y);
                serverCursor.cellX[this.id]   = encoded.cellX;
                serverCursor.cellY[this.id]   = encoded.cellY;
                serverCursor.offsetX[this.id] = encoded.offsetX;
                serverCursor.offsetY[this.id] = encoded.offsetY;
            } else {
                serverCursor.x[this.id] = Math.floor(this.x);
                serverCursor.y[this.id] = Math.floor(this.y);
            }
        }

        deserialize(seed) {
            this.seed = serverCursor.seed[this.id];
            this.flags.value = serverCursor.flags[this.id];

            this.damage = seed;
            this.isCrit = (seedRandom(seed) > 0.5);

            if(SPATIAL_LOCALIZATION_ENABLED == true) {
                const decoded = decodePosition(
                    serverCursor.cellX[this.id],
                    serverCursor.cellY[this.id],
                    serverCursor.offsetX[this.id],
                    serverCursor.offsetY[this.id]
                );

                this.targetX = decoded.x;
                this.targetY = decoded.y;
            } else {
                this.targetX = serverCursor.x[this.id];
                this.targetY = serverCursor.y[this.id];
            }

            this.color = `hsl(${seedRandom(this.seed)*360},80%,60%)`;
            this.pressed = serverCursor.pressed[this.id];
        }
    }

    // Create exactly 10 balls
    for(let i=0;i<COUNT;i++){

        balls.push(
            new Ball(
                40+Math.random()*(canvas.width-80),
                40+Math.random()*(canvas.height-80),
                15+Math.random()*15
            )
        );
    }

    triangles.push(new Triangle(0,0,10));

    function isColliding(a, b, r1, r2) {
        const dx=b.x-a.x;
        const dy=b.y-a.y;

        const dist=Math.hypot(dx,dy);
        const minDist=r1+r2;

        return (dist<minDist);
    }
    function handleCollisions(){

        for(let i=0;i<balls.length;i++){

            for(let j=i+1;j<balls.length;j++){

                const a=balls[i];
                const b=balls[j];

                const dx=b.x-a.x;
                const dy=b.y-a.y;

                const dist=Math.hypot(dx,dy);
                const minDist=a.radius+b.radius;

                if(dist<minDist){

                    const nx=dx/dist;
                    const ny=dy/dist;

                    // Separate balls
                    const overlap=(minDist-dist)/2;

                    a.x-=nx*overlap;
                    a.y-=ny*overlap;

                    b.x+=nx*overlap;
                    b.y+=ny*overlap;

                    // Elastic collision
                    const dvx=a.vx-b.vx;
                    const dvy=a.vy-b.vy;

                    const impact=dvx*nx+dvy*ny;

                    if(impact>0) continue;

                    const impulse=impact;

                    a.vx-=impulse*nx;
                    a.vy-=impulse*ny;

                    b.vx+=impulse*nx;
                    b.vy+=impulse*ny;
                }
            }
        }
    }

    canvas.addEventListener('mousedown', (event) => {
        cursor.pressed[0] = 1;

        if(window.applyInput) applyInput();
    });

    canvas.addEventListener('mouseup', (event) => {
        cursor.pressed[0] = 0;

        if(window.applyInput) applyInput();
    });

    canvas.addEventListener('mousemove', (event) => {
        const x = event.clientX;
        const y = event.clientY;

        cursor.x[0] = x;
        cursor.y[0] = y;

        if(window.applyInput) applyInput();
    });

    canvas.addEventListener('touchmove', (e) => {
        // Prevent scrolling while moving/dragging
        e.preventDefault();

        // Get coordinates for the first finger
        const touch = e.touches[0];
        const x = touch.clientX;
        const y = touch.clientY;

        cursor.x[0] = x;
        cursor.y[0] = y;

        if(window.applyInput) applyInput();
    });

<script>
    let isHost = true;

    // ── State helpers ──────────────────────────────────────────

    // 1. client || server -> change data
    function applyInput() {
        // simulate locally
        triangles[0].x       = cursor.x[0];
        triangles[0].y       = cursor.y[0];
        triangles[0].pressed = cursor.pressed[0];

        // Broadcast
        if(!isHost) {
            // send cursor data
            if(window.clientSendInput) clientSendInput();
        }
    }

    // 2. client -> server
    function decodeInput(raw) {
        // raw is always a Uint8Array
        inputPools.deserialize(raw.buffer);
        applyInput();
    }

    // common state deserialization for both client and server
    function deserializePools(seed) {
        balls.forEach(b => b.deserialize(seed));
        triangles.forEach(t => t.deserialize(seed));
    }

    // 3. server -> clients
    function applyPackedState(raw, seed) {
        // raw is always a Uint8Array
        pools.deserialize(raw.buffer);

        deserializePools(seed);

        return raw;  // return the same Uint8Array for chaining
    }

    function decodeOutput(raw) {
        // raw is always a Uint8Array
        outputPools.deserialize(raw.buffer);
        applyOutput();
    }

    function getStates() {
        balls.forEach(b => b.serialize());
        triangles.forEach(t => t.serialize());

        return new Uint8Array(pools.serialize());
    }

    // ── Game loop ──────────────────────────────────────────────
    let currentTick = 0;
    function logicLoop() {

        // deterministic objects
        if(DETERMINISTIC_ENTITIES_ENABLED) {
            const evalTimeMs = getServerTimestamp();
            const displaySeconds = (evalTimeMs - startTime) / 1000;
            entities.forEach(entity => {
                const state = entity.calculateState(getServerTimestamp());
                const size = state.size || 12;
                const x = state.startX + state.x;
                const y = state.startY + state.y;

                entity.state = {
                    size: size,
                    x: x,
                    y: y,
                    color: state.color,
                    status: state.status,
                };
            });
        }

        // non deterministic objects
        if(isHost) {

            for(const b of balls) {
                b.update();

                if(DETERMINISTIC_ENTITIES_ENABLED) {
                    if(entities.length > 0) {
                        entities.forEach(entity=>{
                            if(isColliding(entity.state, b, entity.state.size, b.radius))
                                b.flags.activate(DIRTY_SKILL_1);
                        })
                    }
                }
            }

            for(const b of triangles) {
                b.update();
            }

            if(broadcast) broadcast();

            for(const b of balls) {
                b.applyEvents();
            }

            for(const b of triangles) {
                b.applyEvents();
            }
        } else {
            // client and host process the updates
            for(const b of balls) {
                // b.updateClient();
                b.applyEvents();
            }

            for(const b of triangles) {
                // b.updateClient();
                b.applyEvents();
            }
        }

        for(const b of deterministicBalls) {
            b.update();
        }



        // handleCollisions();
    }

    function renderLoop(dt) {
        ctx.clearRect(0,0,canvas.width,canvas.height);

        for(const b of balls) {
            if(!isHost) b.updateClient(dt);
            b.draw();
        }

        for(const b of triangles) {
            if(!isHost) b.updateClient(dt);
            b.draw();
        }

        for(const b of deterministicBalls)
            b.draw();

        if(DETERMINISTIC_ENTITIES_ENABLED) {
            entities.forEach(entity => {
                // Safely check if state exists and is empty
                if (!entity?.state || Object.keys(entity.state).length === 0) return;

                const size = entity.state.size;
                const x = entity.state.x;
                const y = entity.state.y;

                ctx.fillStyle = entity.state.color;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#e1e1e6";
                ctx.font = "12px sans-serif";

                ctx.fillText(`${entity.type} (${entity.state.status})`, x + 18, y + 4);
                ctx.fillStyle = "#4e4e54";
                ctx.font = "10px monospace";
                ctx.fillText(`X: ${Math.round(x)} Y: ${Math.round(y)}`, x + 18, y + 16);
            });
        }

        ctx.fillStyle="white";
        ctx.font="16px Arial";
        ctx.fillText("Objects: "+balls.length,10,canvas.height-15);

        const displaySeconds = (getServerTimestamp() - startTime) / 1000;
        ctx.fillText(`Time Elapsed: ${displaySeconds.toFixed(2)}s`,10,canvas.height-30);
        ctx.fillText(`Tick Elapsed: ${currentTick}`,10,canvas.height-45);
    }

</script>
<script>
// ALMOST NEVER TOUCH BELOW THIS
    const LOOP = {
        lastTime: performance.now(),
        acc: 0,
        hz: 1000 / FPS,
        MAX_DELTA: 100, // ms, prevents spiral of death
    };

    let renderTick = 0;

    function gameLoop(dt) {
        if(window.drainBufferedState) window.drainBufferedState();
        const time = performance.now();
        let delta = time - LOOP.lastTime;
        LOOP.lastTime = time;

        if (delta > LOOP.MAX_DELTA) {
            console.warn('Game is slowing down');
            delta = LOOP.MAX_DELTA;
        }

        LOOP.acc += delta;

        while (LOOP.acc >= LOOP.hz) {
            logicLoop();
            LOOP.acc -= LOOP.hz;
            fds.update(LOOP.hz/1000);
        }

        // RENDER STUFF
        // console.log(delta/1000)
        renderLoop(delta/LOOP.hz);

        // ---- Render floating damage system ----
        fds.render(ctx);

        requestAnimationFrame(gameLoop);
    }

    gameLoop();

    // ── Networking ─────────────────────────────────────────────
    let broadcast = null;

    const PACKET_TYPE_ENUM = [
        'Snapshot',
        'Delta',
        'Event',
    ];

    function startAsHost(peer) {
        const clients = [];
        let tick = 0;
        let prevState = null;
        let current = null;
        let lastPayload = null;

        peer.on('connection', conn => {
            clients.push(conn);

            conn.on('data', raw => decodeInput(new Uint8Array(raw)));  // raw is ArrayBuffer from DataChannel
            conn.on('open', () => {
                if (current) conn.send(packPacketWithSeed(tick, 1, PACKET_TYPE_ENUM.indexOf('Snapshot'), current).buffer);
            });
        });

        // Clean up when the tab or window is closing / refreshing
        window.addEventListener('beforeunload', () => {
          if (peer && !peer.destroyed) {
            peer.destroy();
          }
        });

        broadcast = () => {
            tick++;
            currentTick = tick;
            current = getStates();
            const seed = Math.floor(Math.random()*1000);

            if (clients.length) {
                const payload = prevState
                    ? createDeltaOptimized(prevState, current)   // both are Uint8Array
                    : current;
                prevState = current;

                const packet = packPacketWithSeed(tick, seed, PACKET_TYPE_ENUM.indexOf('Delta'), payload);
                lastPayload = packet;
                clients.forEach(conn => {
                    if (conn?.open && conn.dataChannel.bufferedAmount < 16384) {
                        conn.send(packet.buffer);
                    }
                });
            }

            // apply the payload to self too
            applyPackedState(current, seed);
        }

        window.serverSendInput = () => {
            if (!clients.length) return;
            const packet = packPacketWithSeed(tick, Math.floor(Math.random()*1000), PACKET_TYPE_ENUM.indexOf('Event'), new Uint8Array(outputPools.serialize()));
            clients.forEach(conn => {
                if (conn?.open && conn.dataChannel.bufferedAmount < 16384) {
                    conn.send(packet);   // returns ArrayBuffer, which is acceptable
                }
            });
        };

        // Optional bandwidth logging
        setInterval(() => {
            if (!lastPayload) return;
            console.log(getMaxUserCount(lastPayload.byteLength / 3, 5_000_000, FPS), lastPayload.byteLength);
        }, 1000);
    }

    function startAsClient(peer, hostname) {
        let previous = null;
        let receivedTick = -1;
        let receivedInitial = false;
        let bufferedStates = [];
        peer.on('open', () => {
            const conn = peer.connect(hostname, { reliable: true });
            conn.on('error', console.error);

            // buffer is needed for batched slow connections
            conn.on('data', raw => {
                const { tick, seed, type, payload } = unpackPacketWithSeed(new Uint8Array(raw));
                bufferedStates.push({ tick, seed, type, payload });
            });

            // run at render
            window.drainBufferedState = function() {
                if(bufferedStates.length==0) return;
                const { tick, seed, type, payload } = bufferedStates.shift();

                if(type == PACKET_TYPE_ENUM.indexOf('Event')) {
                    decodeOutput(payload);
                }

                if (receivedTick > tick) return;

                // console.log(receivedTick-tick, seed);

                receivedTick = tick;
                currentTick = receivedTick;

                if (type === PACKET_TYPE_ENUM.indexOf('Snapshot')) {
                    previous = applyPackedState(payload, seed);
                    receivedInitial = true;
                } else if (type === PACKET_TYPE_ENUM.indexOf('Delta') && receivedInitial) {
                    const rebuilt = applyDeltaOptimized(previous, payload);
                    previous = applyPackedState(rebuilt, seed);
                }
            }

            conn.on('close', () => {
                console.log('❌ Connection closed.');
                console.log('Refreshing the page.');
                location.href=location.href;
            });

            window.clientSendInput = () => {
                if (conn?.open && conn.dataChannel.bufferedAmount < 16384) {
                    conn.send(inputPools.serialize());   // returns ArrayBuffer, which is acceptable
                }
            };
        });
    }
</script>
