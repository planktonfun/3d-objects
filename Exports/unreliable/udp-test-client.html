<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 Object Physics Sandbox</title>

<style>
html, body {
    margin: 0;
    overflow: hidden;
    background: #20242a;
}

canvas {
    display: block;
    background: #2f7fd8;
}

#info{
    position:absolute;
    left:10px;
    top:10px;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    background:rgba(0,0,0,.45);
    padding:8px 12px;
    border-radius:8px;
}
</style>
<script src="./fastBitPacker.js"></script>
<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
</head>
<body>

<div id="info">
10 Objects • Moving Forever
</div>

<canvas id="canvas"></canvas>

<script src='./fastBitPacker.browser.js'></script>
<script>

function animate(){

    requestAnimationFrame(animate);

    ctx.clearRect(0,0,canvas.width,canvas.height);

    for(const b of balls)
        b.draw();

    for(const b of triangles)
        b.draw();

    ctx.fillStyle="white";
    ctx.font="16px Arial";
    ctx.fillText("Objects: "+balls.length,10,canvas.height-15);
}

animate();
const objectSet = {};

for (var i = 0; i < balls.length; i++) {
    objectSet[balls[i].id] = balls[i];
}

for (var i = 0; i < triangles.length; i++) {
    objectSet[triangles[i].id] = triangles[i];

}
// console.log(objectSet);


canvas.addEventListener('mousemove', (event) => {
  const x = event.clientX;
  const y = event.clientY;

  if(window.sendRequest) sendRequest({x,y});
  // triangles[0].x = x;
  // triangles[0].y = y;
});

</script>
<script>

const peer = new Peer();

function connectToPeerInbound(targetId) {
  // Connect Unreliable Channel
  const unreliableConn = peer.connect(targetId, {
      reliable: false,
      metadata: { type: 'unreliable' }
  });

  unreliableConn.on('error', (err) => { console.error("Error: " + err); });
  unreliableConn.on('data', (buffer) => {
        const states = unpackMany(new Uint8Array(buffer), balls.length+triangles.length, packer.unpackFast);
        // console.log(states);

        states.forEach(obj=>{
            // console.log(objectSet[obj.id])
            objectSet[obj.id].deserialize(obj);
        });
    });

    unreliableConn.on('close', () => {
        console.log(`❌ Connection closed by peer.`);
    });

     window.sendRequest = (data) => {
    if (unreliableConn && unreliableConn.open) {
      if (unreliableConn.dataChannel.bufferedAmount < 16384) {
            unreliableConn.send(data);
        }}
    }

    unreliableConn.on('close', () => {
        console.log(`❌ Connection closed by peer.`);
    });
}

function connectToPeerOutbound(targetId) {
  // Connect Unreliable Channel
  const reliableConn = peer.connect(targetId, {
        reliable: true,
        metadata: { type: 'reliable' }
    });

  reliableConn.on('error', (err) => { console.error("Error: " + err); });

  window.sendRequest = (data) => {
    if (reliableConn && reliableConn.open) {
      if (reliableConn.dataChannel.bufferedAmount < 16384) {
            reliableConn.send(data);
        }}
    }

    reliableConn.on('close', () => {
        console.log(`❌ Connection closed by peer.`);
    });
}


peer.on('open', (id) => {
  connectToPeerInbound('server-udp-hi');
  // connectToPeerOutbound('server-udp-hi');
});

</script>
