<body>

    <div class="app" id="app">
        <div class="header">
            <h1>🌐 P2P Mesh</h1>

                <span class="dot idle" id="statusDot"></span>
                <span id="statusLabel">Initializing</span>

        </div>

        <div class="status-bar" id="statusBar">

        </div>

        <div class="chat-container" id="chatContainer">
            <div class="peer-list" id="peerList">
                <span style="font-size:0.7rem;color:#4a5a70;margin-right:4px;">👥 Peers:</span>
                <span class="peer-chip" style="border-color:#3b82f6;color:#60a5fa;">You</span>
            </div>

            <div class="messages" id="messages"></div>

                <div class="mode-selector">
                    <label><input type="radio" name="transferMode" value="files" checked> Select Files (Multi-auto-zip)</label>
                    <label><input type="radio" name="transferMode" value="folder"> Select Folder</label>
                </div>
                <div class="file-row">
                    <label class="file-label" id="fileLabel">
                        📎 Choose Source
                        <input type="file" id="fileInput" multiple />
                    </label>
                    <span class="file-name" id="fileName">No files selected</span>
                    <button class="send-file-btn" id="sendFileBtn" disabled>Send to All</button>
                </div>
                <div class="progress-wrapper" id="progressWrapper">
                    <progress id="transferProgress" value="0" max="100"></progress>
                    <span class="progress-label" id="progressLabel">0%</span>
                    <span class="verify-badge" id="verifyBadge"></span>
                </div>
            </div>

            <div class="input-row">
                <button class="plus-btn" id="toggleFileAreaBtn" title="Toggle file sharing">+</button>
                <input type="text" id="chatInput" placeholder="Type a message … (broadcast to all)" disabled />
                <button class="send-btn" id="sendBtn" disabled>Send</button>
            </div>

            <div class="download-area" id="downloadArea">
                <span class="file-info" id="downloadFileInfo">File received</span>
                <button class="download-btn" id="downloadBtn">⬇ Download</button>
            </div>

        <div class="footer">
            <span>🔹 MQTT · PeerJS mesh &nbsp;•&nbsp; auto-zips multi-files/folders</span>
        </div>

    <script>
        const CHANNEL = 'v2';
        const MQTT_BROKER = 'wss://test.mosquitto.org:8081';
        const MQTT_TOPIC_PRESENCE = 'matchmaking/presence/' + CHANNEL;
        const HEARTBEAT_INTERVAL_MS = 4000;
        const PEER_TIMEOUT_MS = 10000;
        const CHUNK_SIZE = 60 * 1024; // 60 KB

        function calculateAdler32(uint8Array) {
            let a = 1, b = 0;
            for (let i = 0; i < uint8Array.length; i++) {
                a = (a + uint8Array[i]) % 65521;
                b = (b + a) % 65521;
            }
            return ((b << 16) | a) >>> 0;
        }

        const state = {
            mqtt: null,
            peer: null,
            myPeerId: null,
            connections: new Map(),
            knownPeers: new Map(),
            heartbeatTimer: null,
            fileTransfer: {
                active: false,
                totalChunks: 0,
                receivedCount: 0,
                expectedChecksum: 0,
                chunks: [],
                fileName: '',
                fileData: null,
                sending: false,
                senderId: '',
            },
            receivedFileData: null,
            receivedFileName: '',
            receivedFileSender: '',
            isReady: false,
        };

        const $ = (id) => document.getElementById(id);
        const ui = {
            app: $('app'),
            statusDot: $('statusDot'),
            statusLabel: $('statusLabel'),
            statusMsg: $('statusMsg'),
            peerIdDisplay: $('peerIdDisplay'),
            chatContainer: $('chatContainer'),
            messages: $('messages'),
            chatInput: $('chatInput'),
            sendBtn: $('sendBtn'),
            toggleFileAreaBtn: $('toggleFileAreaBtn'),
            fileTransferArea: $('fileTransferArea'),
            fileInput: $('fileInput'),
            fileName: $('fileName'),
            sendFileBtn: $('sendFileBtn'),
            progressWrapper: $('progressWrapper'),
            transferProgress: $('transferProgress'),
            progressLabel: $('progressLabel'),
            verifyBadge: $('verifyBadge'),
            downloadArea: $('downloadArea'),
            downloadFileInfo: $('downloadFileInfo'),
            downloadBtn: $('downloadBtn'),
            peerList: $('peerList'),
            modeRadios: document.querySelectorAll('input[name="transferMode"]')
        };

        function setStatus(level, msg) {
            ui.statusDot.className = 'dot ' + level;
            const map = { idle: 'Idle', searching: 'Searching…', connected: 'Connected' };
            ui.statusLabel.textContent = map[level] || level;
            ui.statusMsg.textContent = msg;
        }

        function appendMessage(text, type) {
            const div = document.createElement('div');
            div.className = 'msg-bubble ' + type;
            div.textContent = text;
            ui.messages.appendChild(div);
            ui.messages.scrollTop = ui.messages.scrollHeight;
        }

        function showChat(show) {
            ui.chatContainer.classList.toggle('active', show);
            ui.chatInput.disabled = !show;
            ui.sendBtn.disabled = !show || state.connections.size === 0;
            if (show) ui.chatInput.focus();
        }

        function updatePeerIdDisplay(id) {
            ui.peerIdDisplay.textContent = id ? id.slice(0, 12) + '…' : '—';
        }

        function showDownload(fileName, data, senderId) {
            state.receivedFileData = data;
            state.receivedFileName = fileName || 'received_file.bin';
            ui.downloadFileInfo.textContent = `📄 ${state.receivedFileName} (${(data.length / 1024).toFixed(1)} KB) from ${senderId.slice(0, 10)}`;
            ui.downloadArea.classList.add('active');
        }

        function renderPeerList() {
            const container = ui.peerList;
            while (container.children.length > 1) {
                container.removeChild(container.lastChild);
            }
            const connectedIds = Array.from(state.connections.keys());
            const knownIds = Array.from(state.knownPeers.keys()).filter(id => id !== state.myPeerId);
            const allPeerIds = new Set([...connectedIds, ...knownIds]);

            for (const id of allPeerIds) {
                if (id === state.myPeerId) continue;
                const isConnected = state.connections.has(id);
                const chip = document.createElement('span');
                chip.className = 'peer-chip' + (isConnected ? ' online' : '');
                chip.textContent = id.slice(0, 10) + (isConnected ? ' ●' : ' ○');
                container.appendChild(chip);
            }
            const hasPeers = state.connections.size > 0;
            ui.sendBtn.disabled = !hasPeers;
            ui.sendFileBtn.disabled = !ui.fileInput.files || ui.fileInput.files.length === 0 || !hasPeers;
            ui.app.classList.toggle('active', hasPeers);
        }

        function connectMQTT() {
            const client = mqtt.connect(MQTT_BROKER, {
                clientId: 'p2p-' + Math.random().toString(36).slice(2, 10),
                clean: true,
                    reconnectPeriod: 3000,
                    connectTimeout: 8000,
            });
            client.on('connect', () => {
                state.mqtt = client;
                client.subscribe(MQTT_TOPIC_PRESENCE);
            });

            client.on('message', (topic, payload) => {
                if (topic === MQTT_TOPIC_PRESENCE) {
                    try {
                        const data = JSON.parse(payload.toString());
                        handlePresence(data);
                    } catch (_) {}
                }
            });

        }

        function publishPresence() {
            if (!state.mqtt || !state.mqtt.connected || !state.myPeerId) return;
            const msg = JSON.stringify({
                peerId: state.myPeerId,
                status: state.connections.size > 0 ? 'connected' : 'available',
                ts: Date.now(),
            });
            state.mqtt.publish(MQTT_TOPIC_PRESENCE, msg);
        }

        function handlePresence(data) {
            if (!data.peerId || data.peerId === state.myPeerId) return;
            const now = Date.now();
            const peer = state.knownPeers.get(data.peerId) || { lastSeen: 0, status: 'unknown' };
            peer.lastSeen = now;
            peer.status = data.status || 'available';
            state.knownPeers.set(data.peerId, peer);

            // Cleanup stale peers
            for (const [id, p] of state.knownPeers) {
                if (now - p.lastSeen > PEER_TIMEOUT_MS) {
                    state.knownPeers.delete(id);
                    // Also close connection if exists
                    if (state.connections.has(id)) {
                        closeConnection(id);
                    }
                }
            }

            renderPeerList();
            if (state.isReady && state.peer && !state.connections.has(data.peerId) && data.peerId > state.myPeerId) {
                attemptConnect(data.peerId);
            }
        }

        function attemptConnect(peerId) {
            if (!state.peer || state.connections.has(peerId)) return;
            const conn = state.peer.connect(peerId, { reliable: true, serialization: 'raw' });
            conn.on('open', () => onConnectionEstablished(conn, peerId));
        }

        function onConnectionEstablished(conn, peerId) {
            if (state.connections.has(peerId)) { conn.close(); return; }
            state.connections.set(peerId, { conn, peerId, open: true });
            appendMessage('🔗 Connected to ' + peerId.slice(0, 10), 'system');
            renderPeerList();
            publishPresence();

            conn.on('data', (data) => handlePeerData(peerId, data));
            conn.on('close', () => {
                closeConnection(peerId);
            });
            setStatus('connected', state.connections.size + ' peer(s) connected');
            showChat(true);
        }

        function closeConnection(peerId) {
            state.connections.delete(peerId);
            appendMessage('🔌 Disconnected from ' + peerId.slice(0, 10), 'system');
            renderPeerList();
            publishPresence();
            if (state.connections.size === 0) setStatus('searching', 'No peers connected');
        }

        function handlePeerData(senderId, data) {
            if (typeof data === 'string') {
                if (data.startsWith('FILE_NAME:')) {
                    state.fileTransfer.fileName = data.substring(10);
                    state.fileTransfer.senderId = senderId;
                    return;
                }
                appendMessage('💬 ' + senderId.slice(0, 10) + ': ' + data, 'other');
                return;
            }

            const packet = new Uint8Array(data);
            if (packet.byteLength < 12) return;
            const view = new DataView(packet.buffer);
            const totalChunks = view.getUint32(0, true);
            const chunkIndex = view.getUint32(4, true);
            const expectedChecksum = view.getUint32(8, true);

            const ft = state.fileTransfer;
            if (ft.receivedCount === 0) {
                ft.totalChunks = totalChunks;
                ft.expectedChecksum = expectedChecksum;
                ft.chunks = new Array(totalChunks);
                ft.active = true;
                ft.senderId = senderId;
                ui.progressWrapper.classList.add('active');
            }

            ft.chunks[chunkIndex] = new Uint8Array(packet.buffer, 12, packet.byteLength - 12);
            ft.receivedCount++;

            const pct = Math.round((ft.receivedCount / totalChunks) * 100);
            ui.transferProgress.value = pct;
            ui.progressLabel.textContent = pct + '%';

            if (ft.receivedCount === totalChunks) {
                const totalLen = ft.chunks.reduce((acc, c) => acc + c.length, 0);
                const merged = new Uint8Array(totalLen);
                let offset = 0;
                for (const c of ft.chunks) { merged.set(c, offset); offset += c.length; }

                if (calculateAdler32(merged) === ft.expectedChecksum) {
                    appendMessage('✅ Archive/File successfully received!', 'file-status success');
                    showDownload(ft.fileName || 'bundle.zip', merged, senderId);
                } else {
                    appendMessage('❌ Checksum Mismatch!', 'file-status error');
                }
                ft.active = false;
                ft.chunks = [];
                ft.receivedCount = 0;
            }
        }

        function initPeerJS() {
            const peer = new Peer(null, { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });
            peer.on('open', (id) => {
                state.myPeerId = id;
                state.peer = peer;
                state.isReady = true;
                updatePeerIdDisplay(id);
                setInterval(publishPresence, HEARTBEAT_INTERVAL_MS);
                publishPresence();
                showChat(true);
            });
            peer.on('connection', (conn) => {
                conn.on('open', () => onConnectionEstablished(conn, conn.peer));
            });
            state.peer = peer;
        }

        // Toggle file transfer area view via '+' button
        ui.toggleFileAreaBtn.addEventListener('click', () => {
            ui.fileTransferArea.classList.toggle('active');
        });

        // Mode Switching behavior for File Inputs
        ui.modeRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                ui.fileInput.value = '';
                ui.fileName.textContent = 'No files selected';
                ui.sendFileBtn.disabled = true;
                if (e.target.value === 'folder') {
                    ui.fileInput.setAttribute('webkitdirectory', '');
                } else {
                    ui.fileInput.removeAttribute('webkitdirectory');
                }
            });
        });

        ui.fileInput.addEventListener('change', () => {
            const count = ui.fileInput.files.length;
            if (count === 0) {
                ui.fileName.textContent = 'No files selected';
                ui.sendFileBtn.disabled = true;
                return;
            }
            ui.fileName.textContent = count === 1 ? ui.fileInput.files[0].name : `${count} items selected (Will auto-zip)`;
            ui.sendFileBtn.disabled = state.connections.size === 0;
        });

        async function sendFile() {
            const files = ui.fileInput.files;
            if (files.length === 0 || state.connections.size === 0) return;

            ui.sendFileBtn.disabled = true;
            ui.fileInput.disabled = true;
            ui.progressWrapper.classList.add('active');
            ui.transferProgress.value = 0;

            let fileDataArrayBuffer;
            let finalFileName;

            if (files.length > 1 || ui.fileInput.hasAttribute('webkitdirectory')) {
                appendMessage('📦 Compressing files/folder into .zip archive...', 'system');
                const zip = new JSZip();

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const path = file.webkitRelativePath || file.name;
                    zip.file(path, await file.arrayBuffer());
                }

                fileDataArrayBuffer = await zip.generateAsync({
                    type: 'arraybuffer',
                    compression: 'DEFLATE',
                    compressionOptions: { level: 6 }
                }, (metadata) => {
                    ui.transferProgress.value = metadata.percent;
                    ui.progressLabel.textContent = `${metadata.percent.toFixed(0)}%`;
                });
                finalFileName = 'p2p_bundle.zip';
            } else {
                finalFileName = files[0].name;
                fileDataArrayBuffer = await files[0].arrayBuffer();
            }

            for (const [id, entry] of state.connections) {
                try { entry.conn.send('FILE_NAME:' + finalFileName); } catch (_) {}
            }

            const data = new Uint8Array(fileDataArrayBuffer);
            const checksum = calculateAdler32(data);
            const totalChunks = Math.ceil(data.length / CHUNK_SIZE);

            appendMessage(`📤 Transmitting ${finalFileName} (${(data.length / 1024).toFixed(1)} KB)...`, 'system');

            for (let i = 0; i < totalChunks; i++) {
                const start = i * CHUNK_SIZE;
                const chunkData = data.subarray(start, Math.min(start + CHUNK_SIZE, data.length));

                const packet = new Uint8Array(12 + chunkData.length);
                const view = new DataView(packet.buffer);
                view.setUint32(0, totalChunks, true);
                view.setUint32(4, i, true);
                view.setUint32(8, checksum, true);
                packet.set(chunkData, 12);

                for (const [id, entry] of state.connections) {
                    try { entry.conn.send(packet.buffer); } catch (_) {}
                }

                const pct = Math.round(((i + 1) / totalChunks) * 100);
                ui.transferProgress.value = pct;
                ui.progressLabel.textContent = pct + '%';
            }

            appendMessage('✅ Transfer complete!', 'system');
            ui.fileInput.disabled = false;
            ui.sendFileBtn.disabled = false;
            ui.fileInput.value = '';
            ui.fileName.textContent = 'No files selected';
            ui.fileTransferArea.classList.remove('active');
        }

        function sendChatMessage() {
            const text = ui.chatInput.value.trim();
            if (!text || state.connections.size === 0) return;
            for (const [id, entry] of state.connections) {
                try { entry.conn.send(text); } catch (_) {}
            }
            appendMessage(text, 'self');
            ui.chatInput.value = '';
            ui.chatInput.focus();
        }

        ui.sendBtn.addEventListener('click', sendChatMessage);
        ui.chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendChatMessage();
            }
        });

        ui.sendFileBtn.addEventListener('click', sendFile);
        ui.downloadBtn.addEventListener('click', () => {
            if (!state.receivedFileData) return;
            const blob = new Blob([state.receivedFileData]);
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = state.receivedFileName || 'bundle.zip';
            a.click();
            URL.revokeObjectURL(url);
        });

        connectMQTT();
        initPeerJS();

        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (state.heartbeatTimer) clearInterval(state.heartbeatTimer);
            if (state.mqtt) {
                if (state.myPeerId) {
                    const msg = JSON.stringify({
                        peerId: state.myPeerId,
                        status: 'offline',
                        ts: Date.now(),
                    });
                    state.mqtt.publish(MQTT_TOPIC_PRESENCE, msg, { qos: 0, retain: false });
                }
                state.mqtt.end(true);
            }
            if (state.peer) state.peer.destroy();
            // Close all connections
            for (const [id, entry] of state.connections) {
                try { entry.conn.close(); } catch (_) {}
            }
        });

        // Periodic cleanup
        setInterval(() => {
            const now = Date.now();
            for (const [id, p] of state.knownPeers) {
                if (now - p.lastSeen > PEER_TIMEOUT_MS) {
                    state.knownPeers.delete(id);
                }
            }
            renderPeerList();
        }, 15000);
    </script>
</body>
</html>
